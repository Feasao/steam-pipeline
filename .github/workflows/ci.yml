name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: DAG tests and requirements sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Pipeline requirements copy is in sync
        run: diff requirements.txt orchestration/include/pipeline-requirements.txt

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Airflow (same version as the Astro image)
        run: |
          pip install "apache-airflow==3.3.2" apache-airflow-providers-standard pytest \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.13.txt

      - name: DAG integrity tests
        working-directory: orchestration
        run: pytest tests/ -v
  dbt:
    name: dbt build (CI dataset)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write          # allows requesting GitHub's signed token for the Google exchange
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned requirements with same versions as prod
        run: pip install -r requirements.txt

      - name: dbt deps
        working-directory: steam
        run: dbt deps

      - name: dbt build into steam_ci
        working-directory: steam
        run: dbt build --target ci