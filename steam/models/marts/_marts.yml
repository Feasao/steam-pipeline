version: 2

models:
  - name: fct_player_peaks
    description: >
      Steam's top 100 peak concurrent players for apps daily one row per app
    columns:
      - name: appid
        tests: [not_null]
      - name: rollup_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [appid, rollup_date]

  - name: fct_price_history
    description: >
      SCD2-style price history, one row per app per price version for successful fetches. This gets rebuilt from raws each run.
    columns:
      - name: appid
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: current_price
        tests: [not_negative]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [appid, valid_from]

  - name: dim_apps
    description: frozen working set, 784 apps, 2026-09-09
    columns:
      - name: appid
        tests: [not_null, unique]
      - name: source
        tests: [not_null]

  - name: fct_reviews
    description: >
      One row per MMG review, without review_text because it is 80% of the table. Incremental arrival simulated.
    columns:
      - name: recommendationid
        tests: [not_null, unique]
      - name: appid
        tests: [not_null]

  - name: fct_reviews_tracked
    description: >
      Reviews for the 784 tracked titles. Incremental by month like fct_reviews. Run --full-refresh if the
      seed changes
    columns:
      - name: recommendationid
        tests: [not_null, unique]
      - name: appid
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('app_ids')
                field: appid