version: 2

models:
  - name: stg_prices
    description: One row per app per collection run, with price and status parsed from the raw payload
    columns:
      - name: appid
        tests: [not_null]
      - name: collected_at
        tests: [not_null]
      - name: price_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  ["priced", "free", "unreleased", "fetch_failed", "unpriced"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [appid, collected_at]
