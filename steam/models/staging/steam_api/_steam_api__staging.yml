version: 2

models:
  - name: stg_prices
    description: Steam title prices stg, one row per app
    columns:
      - name: appid
        tests: [not_null]
      - name: collected_at
        tests: [not_null]
      - name: price_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["priced", "free", "unreleased", "fetch_failed", "unpriced"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [appid, collected_at]

  - name: stg_prices_current
    description: Latest successful observation per app for the snapshot. Failed fetches are excluded.
    columns:
      - name: appid
        tests: [not_null, unique]

  - name: stg_charts
    description: >
      One row per app from the top-100 GetMostPlayedGames ranking.
    columns:
      - name: appid
        tests: [not_null]
      - name: rollup_date
        tests: [not_null]
      - name: chart_rank
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100
      - name: peak_players
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [appid, collected_at]
