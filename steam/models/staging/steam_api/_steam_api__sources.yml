version: 2

sources:
  - name: steam_raw
    description: Raw Steam API responses
    schema: steam_raw
    tables:
      - name: raw_prices
        description: One row per app. Response_json has the appdetails.
        columns:
          - name: appid
            tests: [not_null]
          - name: collected_at
            tests: [not_null]
      - name: raw_charts
        description: Response_json has yesterdays top-100 concurrents ranking.
