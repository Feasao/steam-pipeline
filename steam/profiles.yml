steam:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: steam_staging
      location: EU
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1
    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: steam_ci
      location: EU
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1
      maximum_bytes_billed: 5000000000   # any query that would scan more than 5 GB is refused